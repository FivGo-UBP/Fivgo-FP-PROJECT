<ion-header class="ion-no-border">
  <ion-toolbar class="bg-blue">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile" text="" icon="chevron-back-outline" class="text-white"></ion-back-button>
    </ion-buttons>
    <ion-title>Keamanan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-container">
    
    <div class="section-title">
      <h3>KEAMANAN AKUN</h3>
    </div>

    <div class="card-container">
      <ion-item button detail="false" routerLink="/form-pengajuan" [queryParams]="{ type: 'update' }" class="menu-item">
        <div class="icon-wrapper" slot="start">
          <ion-icon name="create-outline" class="text-blue"></ion-icon>
        </div>
        <ion-label>
          <h2>Update Akun</h2>
          <p>Perbarui informasi akun Anda</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end" class="arrow-icon"></ion-icon>
      </ion-item>
    </div>

    <div class="section-title mt-4">
      <h3>TINDAKAN AKUN</h3>
    </div>

    <div class="card-container">
      <ion-item button detail="false" routerLink="/form-pengajuan" [queryParams]="{ type: 'delete' }" class="menu-item delete-item">
        <div class="icon-wrapper danger-bg" slot="start">
          <ion-icon name="trash-outline" color="danger"></ion-icon>
        </div>
        <ion-label color="danger">
          <h2>Hapus Akun</h2>
          <p>Hapus akun permanen</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end" color="danger" class="arrow-icon"></ion-icon>
      </ion-item>
    </div>

  </div>
</ion-content>
