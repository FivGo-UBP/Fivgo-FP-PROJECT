<ion-content [fullscreen]="true" class="profile-content">
  <div class="header-background">
    <div class="header-top">
      <ion-button fill="clear" color="light" routerLink="/tabs/beranda" class="back-btn">
        <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
        Profil
      </ion-button>
    </div>

    <div class="profile-info">
      <div class="avatar-container">
        <img [src]="profileImage" alt="Profile" referrerpolicy="no-referrer">
      </div>
      <h2 class="profile-name">{{ user?.name || 'Driver Name' }}</h2>
      <p class="profile-phone">{{ user?.phone || 'No phone' }}</p>
      
      <ion-button class="edit-profile-btn" shape="round" color="light" routerLink="/edit-profile">
        Edit Profile
      </ion-button>
    </div>
  </div>

  <div class="menu-list-container">
    <ion-list class="menu-list" lines="full">
      <ion-item button detail="true">
        <div class="icon-wrapper bg-orange-light" slot="start">
          <ion-icon name="shield-checkmark" class="text-orange"></ion-icon>
        </div>
        <ion-label>Keamanan</ion-label>
      </ion-item>

      <ion-item button detail="true" routerLink="/tabs/aktivitas">
        <div class="icon-wrapper bg-orange-light" slot="start">
          <ion-icon name="time" class="text-orange"></ion-icon>
        </div>
        <ion-label>Aktivitas</ion-label>
      </ion-item>

      <ion-item button detail="true" (click)="goToKinerjaDriver()">
        <div class="icon-wrapper bg-orange-light" slot="start">
          <ion-icon name="star" class="text-orange"></ion-icon>
        </div>
        <ion-label>Kinerja Driver</ion-label>
      </ion-item>

      <ion-item button detail="true">
        <div class="icon-wrapper bg-orange-light" slot="start">
          <ion-icon name="globe" class="text-orange"></ion-icon>
        </div>
        <ion-label>Bahasa</ion-label>
        <span slot="end" class="language-text">Bahasa Indonesia</span>
      </ion-item>

      <ion-item button detail="true">
        <div class="icon-wrapper bg-orange-light" slot="start">
          <ion-icon name="help-circle" class="text-orange"></ion-icon>
        </div>
        <ion-label>Bantuan</ion-label>
      </ion-item>
    </ion-list>
  </div>

  <div class="bottom-actions">
    <ion-button expand="block" fill="outline" class="logout-btn" shape="round">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Keluar
    </ion-button>
    
    <div class="delete-account-container">
      <ion-button fill="clear" color="danger" class="delete-account-btn">
        Hapus Akun
      </ion-button>
    </div>
  </div>
</ion-content>
