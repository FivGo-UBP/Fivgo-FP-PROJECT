<ion-content [fullscreen]="true" class="custom-bg">
  <!-- Header Area (Green Background) -->
  <div class="green-header">
    <div class="header-top">
      <ion-button fill="clear" (click)="goBack()" class="btn-back">
        <ion-icon name="chevron-back-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
      </ion-button>
    </div>

    <div class="header-content">
    </div>
  </div>

  <!-- Floating Search Bar -->
  <div class="floating-search">
    <div class="search-left" (click)="goToOrder()">
      <ion-icon name="location" class="pin-icon"></ion-icon>
      <span class="placeholder-text">Mau ke mana?</span>
    </div>
  </div>

  <div class="content-body">
    <!-- Recent Locations -->
    <div class="recent-locations" *ngIf="recentLocations && recentLocations.length > 0">
      <div class="location-item" *ngFor="let loc of recentLocations" (click)="selectLocation(loc)">
        <div class="icon-wrap">
          <ion-icon name="time-outline"></ion-icon>
        </div>
        <div class="loc-text">
          <h4>{{ loc.name }}</h4>
          <p>{{ loc.address }}</p>
        </div>
      </div>
    </div>
    <h3 class="section-title">buat setiap perjalanan selalu</h3>
    <div class="horizontal-scroll">
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="keamanan 1" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="keamanan 2" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="keamanan 3" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="keamanan 4" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/3f/82/ee/3f82ee0a7af7ebce1bc9fb94c25eb4f3.jpg" alt="keamanan 5" />
      </div>
    </div>
    <h3 class="section-title">Promo</h3>
    <div class="horizontal-scroll">
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="promo 1" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="promo 2" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="promo 3" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/eb/64/9d/eb649d28c347f75d5b746ea5efdddd33.jpg" alt="promo 4" />
      </div>
      <div class="promo-img-card">
        <img src="https://i.pinimg.com/736x/3f/82/ee/3f82ee0a7af7ebce1bc9fb94c25eb4f3.jpg" alt="promo 5" />
      </div>
    </div>
  </div>
</ion-content>
