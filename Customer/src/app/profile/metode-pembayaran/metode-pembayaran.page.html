<ion-header class="ion-no-border">
  <ion-toolbar class="bg-orange">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/kelola-profile" text="Metode Pembayaran" icon="chevron-back-outline" class="text-white"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-grey">

  <!-- Banner Info -->
  <div class="info-banner">
    <ion-icon name="information-circle-outline" class="info-icon"></ion-icon>
    <span>Bayar lebih praktis tanpa uang tunai</span>
  </div>

  <!-- Pilihan Pembayaran -->
  <div class="section">
    <h2 class="section-title">Pilihan pembayaranmu</h2>
    <p class="section-subtitle">Geser kiri untuk jadikan pilihan utama</p>

    <ion-list class="payment-list" lines="none">

      <!-- Tunai -->
      <ion-item-sliding>
        <ion-item class="payment-item" [class.selected]="selectedPayment === 'tunai'">
          <div class="payment-icon-box" slot="start">
            <ion-icon name="cash-outline" class="payment-icon"></ion-icon>
          </div>
          <ion-label class="payment-label">Tunai</ion-label>
          <div slot="end" class="radio-circle" [class.radio-active]="selectedPayment === 'tunai'" (click)="selectPayment('tunai')">
            <div class="radio-inner" *ngIf="selectedPayment === 'tunai'"></div>
          </div>
        </ion-item>
        <ion-item-options side="start">
          <ion-item-option color="primary" (click)="setUtama('tunai')">
            <ion-icon name="star-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>

      <div class="item-divider"></div>

      <!-- Non Tunai -->
      <ion-item-sliding>
        <ion-item class="payment-item" [class.selected]="selectedPayment === 'nontunai'" (click)="toggleNonTunai()">
          <div class="payment-icon-box payment-icon-box--blue" slot="start">
            <ion-icon name="card-outline" class="payment-icon payment-icon--white"></ion-icon>
          </div>
          <ion-label class="payment-label">
            <span *ngIf="selectedPayment !== 'nontunai'">Non Tunai : QRIS/VA</span>
            <span *ngIf="selectedPayment === 'nontunai'">Non Tunai : {{ getSelectedNonTunaiLabel() }}</span>
          </ion-label>
          <div slot="end" class="radio-circle" [class.radio-active]="selectedPayment === 'nontunai'" (click)="selectPayment('nontunai'); $event.stopPropagation()">
            <div class="radio-inner" *ngIf="selectedPayment === 'nontunai'"></div>
          </div>
        </ion-item>
        <ion-item-options side="start">
          <ion-item-option color="primary" (click)="setUtama('nontunai')">
            <ion-icon name="star-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>

    </ion-list>
  </div>

</ion-content>
